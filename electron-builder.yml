appId: ai.triangllabs.otis
productName: Otis
directories:
  buildResources: resources
  output: dist/desktop
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/icon.png
    to: icon.png
# Auto-update feed. Artifacts are still attached by the workflow (--publish never); this only tells
# electron-builder to emit the latest*.yml manifests electron-updater reads.
publish:
  - provider: github
    owner: triangllabs
    repo: otis
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
mac:
  # macOS selects the default, dark, and mono appearances from the compiled asset catalog.
  icon: resources/Otis.icon
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Developer ID signed + notarized when the CI secrets are present (CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_*).
  # electron-builder applies Electron's hardened-runtime entitlements (JIT etc.) automatically.
  hardenedRuntime: true
  notarize: true
dmg:
  icon: resources/icon.icns
linux:
  # Keep the GUI launcher distinct from the otis terminal command.
  executableName: otis-desktop
  icon: resources/icon.png
  category: Development
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
deb:
  packageName: otis-desktop
