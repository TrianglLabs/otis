<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Whichever scheme the app is in: a frame whose scheme disagrees with its embedder's is
         painted on an opaque backdrop, and the drawing is meant to sit on the panel. */
      html {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        position: relative;
        overflow: hidden;
        color: var(--canvas-text, #d8dee9);
      }
      #viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        outline: none;
      }
      #viewport.dragging {
        cursor: grabbing;
      }
      /* The parent's zoom pill floats over the foot; the drawing keeps clear of it at rest. */
      #diagram {
        width: calc(100% - 48px);
        max-width: 760px;
        margin: 24px auto 56px;
        transform-origin: center top;
        transition: transform 120ms ease-out;
        will-change: transform;
      }
      #viewport.dragging #diagram {
        transition: none;
      }
      #diagram svg {
        display: block;
        width: auto;
        max-width: 100%;
        height: auto;
      }
      #diagram svg * {
        filter: none;
        box-shadow: none;
      }
      #error {
        margin: 56px 24px 24px;
        max-width: 36rem;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      }
      /* Opened larger, in a dialog over the window: the drawing takes the width it has, in the
         middle of the dialog, and zooms about its own centre. */
      html.large #viewport {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      html.large #diagram {
        max-width: none;
        margin: 0;
        transform-origin: center;
      }
      /* Inline in a document: the drawing sets the frame's height and the page scrolls. */
      html.inline,
      html.inline body {
        height: auto;
        overflow: hidden;
      }
      html.inline #viewport {
        position: static;
        overflow: visible;
        cursor: default;
      }
      html.inline #diagram {
        width: 100%;
        max-width: none;
        margin: 0;
        transition: none;
        will-change: auto;
      }
      html.inline #error {
        margin: 0;
      }
    </style>
    <title>Canvas</title>
  </head>
  <body>
    <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: the canvas accepts keyboard pan and zoom commands -->
    <div id="viewport" role="application" tabindex="0" aria-label="Diagram canvas. Drag to pan; use the controls to zoom.">
      <div id="diagram" role="img"></div>
      <pre id="error" hidden></pre>
    </div>
    <template id="otis-canvas-runtime"></template>
  </body>
</html>
