<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        position: relative;
        overflow: hidden;
        color: var(--canvas-text, #d8dee9);
      }
      #viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        outline: none;
      }
      #viewport.dragging {
        cursor: grabbing;
      }
      #diagram {
        width: calc(100% - 48px);
        max-width: 760px;
        margin: 56px auto 0;
        transform-origin: center top;
        transition: transform 120ms ease-out;
        will-change: transform;
      }
      #viewport.dragging #diagram {
        transition: none;
      }
      #diagram svg {
        display: block;
        width: auto;
        max-width: 100%;
        height: auto;
      }
      #diagram svg * {
        filter: none;
        box-shadow: none;
      }
      #error {
        margin: 56px 24px 24px;
        max-width: 36rem;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      }
      #controls {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--canvas-border, #444);
        border-radius: 8px;
        background: var(--canvas-surface, #262626);
      }
      #controls button {
        display: grid;
        min-width: 26px;
        height: 26px;
        place-items: center;
        padding: 0 6px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--canvas-text, #d8dee9);
        font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #controls button:hover {
        background: var(--canvas-hover, #333);
      }
      #reset-view {
        min-width: 42px;
        color: var(--canvas-muted, #808080);
        font-size: 10px;
      }
    </style>
    <title>Canvas</title>
  </head>
  <body>
    <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: the canvas accepts keyboard pan and zoom commands -->
    <div id="viewport" role="application" tabindex="0" aria-label="Diagram canvas. Drag to pan; use the controls to zoom.">
      <div id="diagram" role="img"></div>
      <pre id="error" hidden></pre>
    </div>
    <div id="controls" role="toolbar" aria-label="Diagram view controls">
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
      <button id="reset-view" type="button" aria-label="Reset view" title="Reset view">100%</button>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    </div>
    <template id="otis-canvas-runtime"></template>
  </body>
</html>
