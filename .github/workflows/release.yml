name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1)"
        required: true
        type: string
      desktop_only:
        description: "Rebuild and re-attach the desktop apps for a version already released"
        required: false
        type: boolean
        default: false
      allow_unsigned:
        description: "Publish macOS apps unsigned when the signing secrets are unavailable"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: otis-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    if: ${{ !inputs.desktop_only }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Preflight Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "main" ]]; then
            printf '%s\n' 'Run releases from main: the version commit lands there.' >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Version must be MAJOR.MINOR.PATCH, for example 0.1.1.' >&2
            exit 1
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            printf 'Release tag %s already exists.\n' "$tag" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists.\n' "$tag" >&2
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Checks
        run: bun run verify

      - name: Verify Terminal UI
        working-directory: tui
        run: |
          rustup update stable --no-self-update
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked

  cli:
    name: CLI (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      # The terminal UI compiles natively on a runner of each platform; the runtime it embeds
      # cross-compiles with Bun. macOS builds both architectures.
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            targets: --target darwin-arm64 --target darwin-x64
            triples: aarch64-apple-darwin x86_64-apple-darwin
          - name: Linux x64
            runner: ubuntu-latest
            targets: --target linux-x64
            triples: x86_64-unknown-linux-musl
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            targets: --target linux-arm64
            triples: aarch64-unknown-linux-musl
          - name: Windows x64
            runner: windows-latest
            targets: --target windows-x64
            triples: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.triples }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The version commit lands after every platform built; each build stamps the version itself.
      - name: Build Archives
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          bun run build ${{ matrix.targets }}

      - name: Upload Archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.runner }}
          path: dist/public/releases/v${{ inputs.version }}/otis-*
          if-no-files-found: error

  release:
    name: Publish
    needs: cli
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Bump Version
        run: jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Gather Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist/public/releases/v${{ inputs.version }}

      - name: Write Checksums And Manifest
        run: bun run build --assemble

      - name: Tag Release
        run: |
          version="v$VERSION"

          git add package.json
          if git diff --cached --quiet; then
            printf '%s\n' 'No package version changes to commit.'
          else
            git commit -m "Release $version"
          fi

          git tag "$version"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            dist/public/install.sh \
            dist/public/install.ps1 \
            dist/public/releases/latest.txt \
            dist/public/releases/v"$VERSION"/* \
            --title "v$VERSION" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: release
    # The tag it builds from already exists when only the desktop apps are being redone.
    if: ${{ always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' }}
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      # node-pty compiles natively for each target, so Linux builds run on a runner of their own
      # architecture, each naming its targets on the command line since a bare --x64/--arm64 does
      # not override the architectures listed in electron-builder.yml. macOS cross-compiles both.
      # Windows ships x64 only, like the terminal command.
      matrix:
        include:
          - os: macOS
            name: macOS
            targets: ""
            runner: macos-latest
          - os: Linux
            name: Linux x64
            targets: --linux AppImage:x64 deb:x64
            runner: ubuntu-latest
          - os: Linux
            name: Linux arm64
            targets: --linux AppImage:arm64 deb:arm64
            runner: ubuntu-24.04-arm
          - os: Windows
            name: Windows x64
            targets: --win nsis:x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release tag itself: desktop artifacts always build from exactly what was released.
          ref: refs/tags/v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Desktop App
        run: bun run build:desktop

      - name: Package Desktop App
        env:
          # macOS signing secrets (see repo docs): base64 Developer ID .p12, its password, App Store Connect API key.
          # The certificate reaches the macOS build only. On the Windows runner electron-builder would take
          # CSC_LINK as the Authenticode certificate, sign with a chain Windows cannot trust, and record its
          # publisher in app-update.yml, after which electron-updater rejects every downloaded update.
          CSC_LINK: ${{ matrix.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Alternative to the API key: your Apple ID + app-specific password + team ID.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          TARGET_OS: ${{ matrix.os }}
        # Git Bash on the Windows runner too, so one script packages every platform.
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$APPLE_API_KEY" ]; then
              key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printenv APPLE_API_KEY > "$key_file"
              chmod 600 "$key_file"
              export APPLE_API_KEY="$key_file"
            fi
            bunx electron-builder --publish never ${{ matrix.targets }}
          elif [ "$TARGET_OS" = "macOS" ] && [ "$ALLOW_UNSIGNED" != "true" ]; then
            echo "macOS signing secrets are missing; set allow_unsigned to publish unsigned." >&2
            exit 1
          else
            echo "Building unsigned." >&2
            bunx electron-builder --publish never -c.mac.identity=null -c.mac.notarize=false ${{ matrix.targets }}
          fi

      - name: Attach macOS Artifacts
        if: matrix.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist/desktop
        run: gh release upload "v$VERSION" ./*.dmg ./*.zip ./latest-mac.yml ./*.blockmap --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attach Linux Artifacts
        if: matrix.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist/desktop
        run: gh release upload "v$VERSION" ./*.AppImage ./*.deb ./latest-linux*.yml --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attach Windows Artifacts
        if: matrix.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist/desktop
        shell: bash
        run: gh release upload "v$VERSION" ./*.exe ./*.blockmap ./latest.yml --clobber --repo "$GITHUB_REPOSITORY"
