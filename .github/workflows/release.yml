name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: otis-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preflight Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            printf '%s\n' 'Run releases from a branch so the version commit remains in repository history.' >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Version must be MAJOR.MINOR.PATCH, for example 0.1.1.' >&2
            exit 1
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            printf 'Release tag %s already exists.\n' "$tag" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists.\n' "$tag" >&2
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Checks
        run: bun run verify

      - name: Bump Version
        run: jq --arg v "${{ inputs.version }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build Binaries
        run: bun run build

      - name: Tag Release
        run: |
          version="v${{ inputs.version }}"

          git add package.json
          if git diff --cached --quiet; then
            printf '%s\n' 'No package version changes to commit.'
          else
            git commit -m "Release $version"
          fi

          git tag "$version"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            dist/public/install.sh \
            dist/public/releases/latest.txt \
            dist/public/releases/v${{ inputs.version }}/* \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --repo ${{ github.repository }}
