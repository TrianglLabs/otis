name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: otis-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preflight Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            printf '%s\n' 'Run releases from a branch so the version commit remains in repository history.' >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Version must be MAJOR.MINOR.PATCH, for example 0.1.1.' >&2
            exit 1
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            printf 'Release tag %s already exists.\n' "$tag" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists.\n' "$tag" >&2
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Checks
        run: bun run verify

      - name: Bump Version
        run: jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build Binaries
        run: bun run build

      - name: Tag Release
        run: |
          version="v$VERSION"

          git add package.json
          if git diff --cached --quiet; then
            printf '%s\n' 'No package version changes to commit.'
          else
            git commit -m "Release $version"
          fi

          git tag "$version"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            dist/public/install.sh \
            dist/public/releases/latest.txt \
            dist/public/releases/v"$VERSION"/* \
            --title "v$VERSION" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: release
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runner: macos-latest
          - os: Linux
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release tag itself: desktop artifacts always build from exactly what was released.
          ref: refs/tags/v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Desktop App
        run: bun run build:desktop

      - name: Package Desktop App
        env:
          # macOS signing secrets (see repo docs): base64 Developer ID .p12, its password, App Store Connect API key.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Alternative to the API key: your Apple ID + app-specific password + team ID.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$APPLE_API_KEY" ]; then
              key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printenv APPLE_API_KEY > "$key_file"
              chmod 600 "$key_file"
              export APPLE_API_KEY="$key_file"
            fi
            bunx electron-builder --publish never
          else
            echo "No signing secrets configured; building unsigned." >&2
            bunx electron-builder --publish never -c.mac.identity=null -c.mac.notarize=false
          fi

      - name: Attach macOS Artifacts
        if: matrix.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist/desktop
        run: gh release upload "v$VERSION" ./*.dmg ./*.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attach Linux Artifacts
        if: matrix.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist/desktop
        run: gh release upload "v$VERSION" ./*.AppImage ./*.deb --clobber --repo "$GITHUB_REPOSITORY"
