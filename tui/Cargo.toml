[package]
name = "otis"
# Releases are versioned in package.json; `otis --version` reports the runtime it embeds.
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Otis terminal UI, in front of the Otis runtime"

[dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
base64 = "0.23"
crossterm = "0.29"
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-colorsaurus = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
